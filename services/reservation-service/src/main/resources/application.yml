server:
  port: 8085

spring:
  application:
    name: reservation-service

  config:
    import: "optional:configserver:http://localhost:8888/"

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/reservation_service
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate