server:
  port: 8888
spring:
  profiles:
    active: dev
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  cloud:
    config:
      server:
        git:
          uri: https://github.com/ibm05-team-3/coliving-platform-config.git
          clone-on-start: true
          default-label: dev
      bus:
        enabled: true
management:
  endpoints:
    web:
      exposure:
        include: busrefresh, health