services:
  # PostgreSQL
  postgres:
    image: postgres:17.11-alpine
    container_name: coliving-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - coliving-platform

  # ★ PostgreSQL + pgvector (community-service 전용, FAQ 봇 벡터 검색)
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: coliving-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    networks:
      - coliving-platform

  # MongoDB
  mongodb:
    image: mongo:7.0.45
    container_name: coliving-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - coliving-platform

  # Redis
  redis:
    image: redis:8.10.2
    container_name: coliving-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - coliving-platform

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:4.3.6-management
    container_name: coliving-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - coliving-platform

  # Zookeeper
  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: coliving-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/opt/zookeeper-3.4.13/data
    networks:
      - coliving-platform

  # Kafka
  kafka:
    image: wurstmeister/kafka:2.13-2.8.1
    container_name: coliving-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9093,OUTSIDE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9093,OUTSIDE://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_LOG_DIRS: /kafka/kafka-logs
      KAFKA_BROKER_ID: 1
    volumes:
      - kafka_data:/kafka
    networks:
      - coliving-platform

volumes:
  postgres_data:
  pgvector_data:   # ★ 추가
  mongo_data:
  redis_data:
  rabbitmq_data:
  zookeeper_data:
  kafka_data:

networks:
  coliving-platform:
    driver: bridge