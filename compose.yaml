services:
  # PostgreSQL
  postgres:
    image: postgres:17.11-alpine
    container_name: coliving-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - coliving-platform

  # ★ PostgreSQL + pgvector (community-service 전용, FAQ 봇 벡터 검색)
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: coliving-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    networks:
      - coliving-platform

  # MongoDB
  mongodb:
    image: mongo:7.0.45
    container_name: coliving-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - coliving-platform

  # Redis
  redis:
    image: redis:8.10.2
    container_name: coliving-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - coliving-platform

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:4.3.6-management
    container_name: coliving-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - coliving-platform

  # Zookeeper
  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: coliving-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/opt/zookeeper-3.4.13/data
    networks:
      - coliving-platform

  # Kafka
  kafka:
    image: wurstmeister/kafka:2.13-2.8.1
    container_name: coliving-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9093,OUTSIDE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9093,OUTSIDE://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_LOG_DIRS: /kafka/kafka-logs
      KAFKA_BROKER_ID: 1
    volumes:
      - kafka_data:/kafka
    networks:
      - coliving-platform

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.5
    container_name: coliving-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - coliving-platform

  # Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.5
    container_name: coliving-kibana
    restart: unless-stopped
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - coliving-platform

  #prometheus
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: coliving-prometheus
    ports:
      - "9090:9090"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - coliving-platform

  #grafana
  grafana:
    image: grafana/grafana:12.0.0
    container_name: coliving-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - coliving-platform

configs:
  #prometheus 설정
  prometheus_config:
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: spring-services
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: ['host.docker.internal:8086']
              labels:
                service: dashboard-service

volumes:
  postgres_data:
  pgvector_data:   # ★ 추가
  mongo_data:
  redis_data:
  rabbitmq_data:
  zookeeper_data:
  kafka_data:
  elasticsearch_data:
  grafana_data:

networks:
  coliving-platform:
    driver: bridge